services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-analyzer-frontend
    ports:
      - "3000:3000"
    volumes:
      # Пробрасываем исходники для hot-reload
      - .:/app
      # Исключаем node_modules из проброса
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:5000}
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio-analyzer-backend
    ports:
      - "5000:5000"
    volumes:
      # Пробрасываем код бэкенда для hot-reload
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
