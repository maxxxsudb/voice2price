services:
  # Frontend: React + Vite
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-analyzer-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      # По умолчанию — адрес бэкенда внутри docker-сети (имя сервиса "backend").
      # Для локальной разработки без Docker переопределите в .env:
      #   VITE_BACKEND_URL=http://localhost:5000
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://backend:5000}
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - app-network

  # Backend: Flask + Python
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio-analyzer-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/audio_analyzer
      - REDIS_URL=redis://redis:6379/0
      # Распознавание по умолчанию: speechkit (облако) или gigaam (локально); в интерфейсе можно выбрать
      - STT_ENGINE=${STT_ENGINE:-speechkit}
      - GIGAAM_URL=http://gigaam:5001
      - GIGAAM_MODEL=${GIGAAM_MODEL:-v3_rnnt}
      # rules — разбор заказа локально по справочнику; llm — прежний платный YandexGPT
      - ORDER_PARSER=${ORDER_PARSER:-rules}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gigaam:
        condition: service_healthy
    networks:
      - app-network

  # Reusable local asynchronous speech-to-text service
  gigaam:
    build:
      context: ./services/gigaam
      dockerfile: Dockerfile
    container_name: gigaam-stt
    ports:
      - "5001:5001"
    environment:
      - GIGAAM_REDIS_URL=redis://redis:6379/1
      - GIGAAM_MODEL=${GIGAAM_MODEL:-v3_rnnt}
      - GIGAAM_CACHE=/models/gigaam
      - GIGAAM_DATA_DIR=/data/jobs
      - GIGAAM_CHUNK_SEC=${GIGAAM_CHUNK_SEC:-22}
      - GIGAAM_OVERLAP_SEC=${GIGAAM_OVERLAP_SEC:-0.8}
      - GIGAAM_RESULT_TTL_SEC=${GIGAAM_RESULT_TTL_SEC:-86400}
    volumes:
      - gigaam_cache:/models/gigaam
      - gigaam_jobs:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: audio-analyzer-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audio_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: audio-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # pgAdmin (опционально, для управления БД)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: audio-analyzer-pgadmin
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  gigaam_cache:
  gigaam_jobs:

networks:
  app-network:
    driver: bridge
